# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
  
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v3

      - name: Read tool versions
        id: tool-versions
        run: |
          echo "lua=$(cat .lua-version)" >> "$GITHUB_OUTPUT"
          echo "luarocks=$(cat .luarocks-version)" >> "$GITHUB_OUTPUT"
          echo "luacheck=$(cat .luacheck-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ steps.tool-versions.outputs.lua }}

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v4
        with:
          luaRocksVersion: ${{ steps.tool-versions.outputs.luarocks }}

      - name: Install Luacheck
        env:
          LUACHECK_VERSION: ${{ steps.tool-versions.outputs.luacheck }}
        run: luarocks install luacheck "$LUACHECK_VERSION"

      - name: Run Make targets
        run: make syntax lint test diff-check
